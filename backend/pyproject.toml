[tool.poetry]
name = "asyncsocketexchange"
version = "0.1.0"
description = "Async interaction beetwen socket server and client"
authors = ["Sergey Vernigora <volt.awp.dev@gmail.com>"]
readme = "README.md"
packages = [
    { include = "sockets" },
    { include = "users" },
    { include = "modems" },
    { include = "common" },
    { include = "logs" },
    { include = "auth" },
    { include = "cli" },
]

include = [
    "exceptions.py",
    "config.py",
    "conn_utils.py",
    "db_connection.py",
    "dependencies.py",
    "main.py",
    "modem_api.py",
    "security.py",
    "validators.py",
    "README.md",
]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.1"
click = "^8.1.7"
fastapi = "^0.112.0"
uvicorn = "^0.30.5"
sqlalchemy = "^2.0.31"
huawei-lte-api = "^1.9.3"
alembic = "^1.13.2"
email-validator = "^2.2.0"
pydantic-settings = "^2.4.0"
psycopg2-binary = "^2.9.9"
bcrypt = "^4.2.0"
python-jose = "^3.3.0"
python-multipart = "^0.0.9"
passlib = "^1.7.4"
websockets = "^12.0"
jinja2 = "^3.1.4"
tabulate = "^0.9.0"
gunicorn = "^23.0.0"
httpx = "^0.27.2"
google-auth = "^2.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
socket-server = "cli.socket_server:cli_socket_server"
web-server = "cli.web_server:cli_web"
proxy-conf-users = "cli.proxy_userlist:cli_proxy_userlist"
proxy-conf-protocols = "cli.proxy_protocol_types:cli_proxy_protocols"
