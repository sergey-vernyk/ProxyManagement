<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
</head>

<body style="font-family: Arial, sans-serif; line-height: 1.6;">
    <h3 style="color: #333;">Hello, {{email}}.</h2>

        <p>Your verification code is:</p>
        <h1 style="color: #007BFF;">{{otp_code}}</h1>
        <p>
            Please enter this code by following to <a style="font-size: 15px;"
                href="{{verification_url}}">{{verification_url}}</a> to complete
            your verification process. The code is valid for {{otp_expire_time}} minutes.
        </p>
        <p>If you did not request this code, please ignore this email.</p>
</body>

</html>
