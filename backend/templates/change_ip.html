<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change IP</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/change_ip.js"></script>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            background-color: #e2e1e1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .ip-info {
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .ip-info p {
            display: flex;
            justify-content: space-between;
            margin: 0;
            font-size: 16px;
            color: #555;
        }

        .ip-info p span:first-child {
            font-weight: bold;
            color: #333;
            width: 30%;
            text-align: left;
        }

        #old-ip,
        #new-ip {
            font-weight: 400;
            width: 70%;
            text-align: right;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .spinner {
            display: none;
            position: absolute;
            top: 40%;
            left: 40%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #3498db;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Push the button to change IP</h2>

        <div id="messages" class="ip-info">
            <p><span>Old IP:</span><span id="old-ip">----.----.----.----</span></p>
            <p><span>New IP:</span><span id="new-ip">----.----.----.----</span></p>
        </div>

        <div id="loading-spinner" class="spinner" style="display: none;"></div>
        <button id="change-ip">Change IP</button>

        <input id="ws-root-url" type="hidden" name="root-ws-url" value="{{ ws_root_url }}">
        <input id="token" type="hidden" name="token" value="{{ token }}">
        <input id="hashed-value" type="hidden" name="hashed-value" value="{{ hashed_value }}">
    </div>

</body>

</html>
