<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Confirm</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/reset_password_confirm.js"></script>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            background-color: #e2e1e1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            width: 100%;
        }

        .input-container {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .error-message {
            color: rgb(235, 27, 27);
            font-size: 14px;
            margin-top: 5px;
            margin-left: 10px;
            text-align: left;
        }

        button {
            background-color: #4CAF50;
            width: 380px;
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            margin-bottom: 15px;
        }

        button:disabled {
            background-color: #759a76;
            cursor: default
        }

        button:hover {
            background-color: #45a049;
        }

        .link {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #3498db;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        #reset-success {
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Reset password confirm</h2>
        <form id="new-password-form" data-reset-confirm-url="{{reset_password_confirm_url}}">
            <div class="input-container">
                <input type="password" id="new-password" name="new_password" placeholder="New Password" required>
                <div id="new-password-error" class="error-message"></div>
            </div>
            <div class="input-container">
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password"
                    required>
                <div id="confirm-password-error" class="error-message"></div>
            </div>
            <button type="submit" id="confirm-reset">Reset password</button>
        </form>
        <input id="uid" type="hidden" name="uid" value="{{uid}}" required readonly>
        <input id="token" type="hidden" name="token" value="{{token}}" required readonly>
        <div id="reset-success"></div>
    </div>
</body>

</html>
