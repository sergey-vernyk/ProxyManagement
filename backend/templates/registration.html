<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/registration.js"></script>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            background-color: #e2e1e1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            width: 100%;
        }

        .input-container {
            margin-bottom: 20px;
            position: relative;
        }

        input[type="email"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .error-message {
            color: rgb(235, 27, 27);
            font-size: 14px;
            margin-top: 5px;
            margin-left: 10px;
            text-align: left;
        }

        button {
            background-color: #4CAF50;
            width: 380px;
            font-family: Georgia, 'Times New Roman', Times, serif, sans-serif;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button:disabled {
            background-color: #759a76;
            cursor: default
        }

        button:hover {
            background-color: #45a049;
        }

        .link {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #3498db;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Register</h2>
        <form id="registration-form" data-reg-url="{{reg_url}}">
            <div class="input-container">
                <input type="email" id="email" name="email" placeholder="Email" required>
                <div id="email-error" class="error-message"></div>
            </div>
            <div class="input-container">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <div id="password-error" class="error-message"></div>
            </div>
            <button type="submit" id="register">Register</button>
        </form>
        <div id="reg-success"></div>
        <a href="/password-reset" class="link">Forgot password?</a>
    </div>
</body>

</html>
