{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="/static/css/reset_password.css">
{% endblock %}

{% block content %}
    <h2>Reset Password</h2>
    <form id="reset-password-form" data-reset-url="{{reset_password_url}}">
        <div class="input-container">
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <div id="email-error" class="error-message"></div>
        </div>
        <button type="submit" id="reset-password">Get reset password link</button>
    </form>
    <div id="reset-success"></div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/reset_password.js"></script>
{% endblock %}
