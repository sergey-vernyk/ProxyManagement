name: SSH Setup and Pull Changes

on:
  workflow_call:
    secrets:
      ssh_user:
        description: "SSH username for the server"
        required: true
      ssh_host:
        description: "Server hostname or IP"
        required: true
      work_dir:
        description: "Directory on the server where the code should be pulled"
        required: true
      ssh_private_key:
        description: "Private SSH key for authentication"
        required: true
    
jobs:
  ssh-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh_private_key }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ssh_host }} >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
 
      - name: Save SSH Configuration as Artifacts
        run: |
          tar -czf ssh_config.tar.gz -C ~/.ssh .

      - name: Upload SSH Config Artifact
        uses: actions/upload-artifact@v4
        with:
            name: ssh-config
            path: ssh_config.tar.gz
            if-no-files-found: error