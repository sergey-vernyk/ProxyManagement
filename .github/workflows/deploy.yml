name: Deploy Kubernetes

on:
  workflow_run:
    workflows: 
      # - Qodana
      - Test FastAPI Application
    types: ["completed"]
    branches:
      - main

  workflow_dispatch:

jobs:
  setup-ssh:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/setup_ssh.yml
    name: Setup SSH
    secrets:
      ssh_user: ${{ secrets.SSH_USER }}
      ssh_host: ${{ secrets.SSH_HOST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      gh_artifacts_gpg_private: ${{ secrets.GH_ARTIFACTS_GPG_PRIVATE }}
      gh_artifacts_gpg_public: ${{ secrets.GH_ARTIFACTS_GPG_PUBLIC }}
      gpg_id: ${{ secrets.GPG_ID }}

  build-push-image:
    if: ${{ !failure() }}
    needs: setup-ssh
    uses: ./.github/workflows/build_and_push_image.yml
    name: Build And Push Image
    with:
      git-ref: ${{ github.event.workflow_run.head_branch }}
      registry: ${{ vars.REGISTRY }}
      image-name: ${{ vars.IMAGE_NAME }}
      context-path: .
      dockerfile-path: Dockerfile
      working-directory: .
      registry-username: ${{ vars.GHCR_USERNAME }}
      additional-labels: |
        org.opencontainers.image.description=Docker image with backend, frontend and CLI.
        org.opencontainers.image.title=Proxy Management
      tags: |
        type=sha
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      
  deploy:
    needs: [setup-ssh, build-push-image]
    if: ${{ ! failure() }}

    name: Deploy Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Download SSH Config Artifact
        uses: actions/download-artifact@v4
        with:
            name: ssh-config
            
      - name: Setup GPG
        run: |
          echo "${{ secrets.GH_ARTIFACTS_GPG_PRIVATE }}" | gpg --import
          echo "${{ secrets.GH_ARTIFACTS_GPG_PUBLIC }}" | gpg --import

          FPR=$(gpg --with-colons --list-keys "${{ secrets.GPG_ID }}" | awk -F: '/^fpr:/ {print $10; exit}')
          echo "${FPR}:6:" | gpg --import-ownertrust
          
      - name: Decrypt And Restore SSH Config
        run: |
          mkdir -p ~/.ssh
          gpg --decrypt ssh_config.tar.gz.asc > ssh_config.tar.gz
          tar -xzf ssh_config.tar.gz -C ~/.ssh
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Pre Rollout
        env:
          KUSTOMIZE_DIR: jobs
        run: |
          IMAGE_TAG=$(echo "${{ needs.build-push-image.outputs.image-tag }}" | cut -d: -f2)
          
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            cd ${{ secrets.MANIFESTS_DIR }}
            export IMAGE_TAG=$IMAGE_TAG
            chmod 750 pre_rollout.sh
            ./pre_rollout.sh ${{ env.KUSTOMIZE_DIR }} ${{ vars.REGISTRY }} ${{ vars.GHCR_USERNAME }} ${{ vars.IMAGE_NAME }} $IMAGE_TAG ${{ vars.K8S_NAMESPACE }}
          EOF

      - name: Disable Cloudflare Under Attack Mode
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        uses: ./.github/actions/setup_cloudflare_security
        with:
          security_level: medium
          cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api_key_cloudflare: ${{ secrets.API_KEY_CLOUDFLARE }}

      - name: Rollout New Deployment
        env:
          KUSTOMIZE_DIR: deployments
        run: |
          IMAGE_TAG=$(echo "${{ needs.build-push-image.outputs.image-tag }}" | cut -d: -f2)

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            cd ${{ secrets.MANIFESTS_DIR }}
            export IMAGE_TAG=$IMAGE_TAG
            chmod 750 rollout.sh
            ./rollout.sh ${{ env.KUSTOMIZE_DIR }} ${{ vars.REGISTRY }} ${{ vars.GHCR_USERNAME }} ${{ vars.IMAGE_NAME }} $IMAGE_TAG ${{ vars.K8S_NAMESPACE }}
          EOF

      - name: Delay for Security Mode Change
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        run: sleep 10

      - name: Health Check
        run: |
          response_code=$(curl -s -w "%{http_code}" -o /tmp/production_health_response.json ${{ secrets.BASE_URL }}/health_check)
          if [ "$response_code" -ne 200 ]; then
              echo "Health check failed with status $response_code"
              exit 1
          else
              echo "Health check passed!"
              echo "Server Health Status:"
              cat /tmp/production_health_response.json | jq
          fi

      - name: Enable Cloudflare Under Attack Mode
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        uses: ./.github/actions/setup_cloudflare_security
        with:
            security_level: under_attack
            cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            api_key_cloudflare: ${{ secrets.API_KEY_CLOUDFLARE }}

      - name: Cleanup
        run: rm -rf ~/.ssh
