name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: 
      - main
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.1
        with:
          # set to true if you want to scan pull requests, 
          # which helps to ensure that code quality checks are applied before merging.
          pr-mode: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_28939578 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'