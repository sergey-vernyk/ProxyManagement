name: Pre-Deploy to Staging

on:
  # workflow_run:
  #   workflows: 
  #     - Run Tests
  #   types: ["completed"]
  #   branches:
  #     - pre-deploy
  push:
    branches:
      - main

jobs:
  setup-ssh:
    uses: ./.github/workflows/setup_ssh.yml
    name: SSH Setup
    secrets:
      ssh_user: ${{ secrets.SSH_USER }}
      ssh_host: ${{ secrets.SSH_HOST }}
      work_dir: ${{ secrets.WORK_DIR }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      gh_artifacts_gpg_private: ${{ secrets.GH_ARTIFACTS_GPG_PRIVATE }}
      gh_artifacts_gpg_public: ${{ secrets.GH_ARTIFACTS_GPG_PUBLIC }}
      gpg_id: ${{ secrets.GPG_ID }}

  changes:
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      nginx: ${{ steps.filter.outputs.nginx }}
      
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # working-directory: ./backend
          filters: |
            backend:
              - './backend/**'
            nginx:
              - './backend/deploy_config/nginx/**'
    
  build-push-backend-image:
    if: ${{ needs.changes.outputs.backend == 'true' }}
    needs: changes
    uses: ./.github/workflows/build_and_push_image.yml
    name: Build And Push Backend Image
    with:
      registry: ${{ vars.REGISTRY }}
      image-name: proxy_management
      context-path: backend
      dockerfile-path: backend/Dockerfile
      working-directory: ./backend
      additional-labels: |
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.description=Image with backend and frontend implementation for proxy management
      tags: |
        type=sha
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  build-push-nginx-image:
    if: ${{ needs.changes.outputs.nginx == 'true' }}
    needs: changes
    uses: ./.github/workflows/build_and_push_image.yml
    name: Build And Push Nginx Image
    with:
      registry: ${{ vars.REGISTRY }}
      image-name: reverse_proxy
      context-path: backend/deploy_config/nginx
      dockerfile-path: backend/deploy_config/nginx/Dockerfile
      working-directory: ./backend
      additional-labels: |
        org.opencontainers.image.licenses=MIT
        org.opencontainers.image.description=Image with custom Nginx configuration
      tags: |
        type=sha
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  pre-deploy:
    env:
      BRANCH: main

    needs: [setup-ssh, changes, build-push-backend-image, build-push-nginx-image]
    if: ! ${{ success() }}
    # if: ${{ 
    #       (needs.build-push-backend-image.result == 'skipped' || needs.build-push-backend-image.result == 'success' || needs.build-push-backend-image.result == 'failure') && 
    #       (needs.build-push-nginx-image.result == 'skipped' || needs.build-push-nginx-image.result == 'success' || needs.build-push-nginx-image.result == 'failure')
    #   }}

    name: Pre-Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Download SSH Config Artifact
        uses: actions/download-artifact@v4
        with:
            name: ssh-config
            
      - name: Setup GPG
        run: |
          echo "${{ secrets.GH_ARTIFACTS_GPG_PRIVATE }}" | gpg --import
          echo "${{ secrets.GH_ARTIFACTS_GPG_PUBLIC }}" | gpg --import

          echo "$(gpg --list-keys --fingerprint \
            | grep -B 1 '${{ secrets.GPG_ID }}' \
            | head -1 \
            | tr -d '[:space:]' \
            | cut -d '=' -f 2):6" | gpg --import-ownertrust
            
      - name: Restore SSH Config
        run: |
          mkdir -p ~/.ssh
          gpg --decrypt ssh_config.tar.gz.asc > ssh_config.tar.gz
          tar -xzf ssh_config.tar.gz -C ~/.ssh
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Changes
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd ${{ vars.CODE_WORK_DIR }} &&
          git checkout ${{ env.BRANCH }} &&
          git pull origin ${{ env.BRANCH }}
          "

      - name: Start Staging Server
        env:
          SERVICE_NAME: stage_backend
          SECRET_ENV_FILE: env_file
          NETWORK_NAME: ${{ vars.DOCKER_STACK_NAME }}_backend
        run: |
          IMAGE_BACKEND_TAG=$(echo "${{ needs.build-push-backend-image.outputs.image-tag || 'no-build' }}" | cut -d: -f2)
          IMAGE_NGINX_TAG=$(echo "${{ needs.build-push-nginx-image.outputs.image-tag || 'no-build' }}" | cut -d: -f2)

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd ${{ vars.CODE_WORK_DIR }} &&
          
          if [[ "$IMAGE_NGINX_TAG" != "no-build" ]]; then
            export IMAGE_NGINX_TAG=${IMAGE_NGINX_TAG}
            docker service update --image ${{ vars.REGISTRY}}/${{github.actor}}/reverse_proxy:${IMAGE_BACKEND_TAG} nginx 
          fi &&

          # extract and validate image tags
          if [[ "$IMAGE_BACKEND_TAG" != "no-build" ]]; then
            export IMAGE_BACKEND_TAG=${IMAGE_BACKEND_TAG}
            # remove existing service if it exists
            if docker service ls --format {{.Name}} | grep -q '${{ env.SERVICE_NAME }}'; then
              docker service rm ${{ env.SERVICE_NAME }}
            fi

            # check for and create service if secret exists
            if docker secret ls --format={{.Name}} | grep -q '${{ env.SECRET_ENV_FILE }}'; then 
              docker service create \
                --name ${{ env.SERVICE_NAME }}  \
                --secret ${{ env.SECRET_ENV_FILE }} \
                --network ${{ env.NETWORK_NAME }} \
                --publish 8001:8001 \
                --with-registry-auth \
                --entrypoint \"/bin/sh -c '~/.local/bin/poetry run uvicorn main:app --env-file /run/secrets/env_file --port 8001 --host 0.0.0.0 --reload'\" \
              ${{ vars.REGISTRY }}/${{ github.actor }}/proxy_management:${IMAGE_BACKEND_TAG}
            else
              echo \"Docker secret '${{ env.SECRET_ENV_FILE }}' does not exist.\"
            fi
          fi
          "
          #--------------------
          # docker stack deploy --compose-file docker-compose.yml ${{ vars.DOCKER_STACK_NAME }} --with-registry-auth
          #-------------------

          # # remove existing service if it exists
          # if docker service ls --format {{.Name}} | grep -q '${{ env.SERVICE_NAME }}'; then
          #   docker service rm ${{ env.SERVICE_NAME }}
          # fi

          # export IMAGE_BACKEND_TAG=${IMAGE_BACKEND_TAG} &&

          # check for and create service if secret exists
          # if docker secret ls --format={{.Name}} | grep -q '${{ env.SECRET_ENV_FILE }}'; then 
          #   docker service create \
          #     --name ${{ env.SERVICE_NAME }}  \
          #     --secret ${{ env.SECRET_ENV_FILE }} \
          #     --network ${{ env.NETWORK_NAME }} \
          #     --publish 8001:8001 \
          #     --with-registry-auth \
          #     --entrypoint \"/bin/sh -c '~/.local/bin/poetry run uvicorn main:app --env-file /run/secrets/env_file --port 8001 --host 0.0.0.0 --reload'\" \
          #     ${{ vars.REGISTRY }}/${{ github.actor }}/proxy_management:${IMAGE_BACKEND_TAG}
          # else
          #   echo \"Docker secret '${{ env.SECRET_ENV_FILE }}' does not exist.\"
          # fi
          #"
  
      - name: Disable Cloudflare Under Attack Mode
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        uses: ./.github/actions/setup_cloudflare_security
        with:
          security_level: medium
          cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api_key_cloudflare: ${{ secrets.API_KEY_CLOUDFLARE }}

      - name: Wait for Server Startup
        run: |
          for i in {1..5}; do
            response_code=$(curl -s -o /dev/null -w "%{http_code}" https://proxman.pp.ua/health_check)
            if [ "$response_code" -eq 200 ]; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 5
          done
          if [ "$response_code" -ne 200 ]; then
            echo "Server did not start in time."
            exit 1
          fi

      - name: Delay for Security Mode Change
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        run: sleep 10 
          
      # - name: Health Check
      #   run: |
      #     response_code=$(curl -s -w "%{http_code}" -o /tmp/stage_health_response.json https://proxman.pp.ua/health_check)
      #     if [ "$response_code" -ne 200 ]; then
      #         echo "Health check failed with status $response_code"
      #         exit 1
      #     else
      #         echo "Health check passed!"
      #         echo "Server Health Status:"
      #         cat /tmp/stage_health_response.json | jq
      #     fi

      - name: Enable Cloudflare Under Attack Mode
        if: ${{ vars.ENABLED_UNDER_ATTACK == 'true' }}
        uses: ./.github/actions/setup_cloudflare_security
        with:
            security_level: under_attack
            cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            api_key_cloudflare: ${{ secrets.API_KEY_CLOUDFLARE }}
        
      - name: Cleanup
        run: rm -rf ~/.ssh
        
