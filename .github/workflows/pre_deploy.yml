name: Pre-Deploy to Staging

on:
    push:
        branches:
        - pre-deploy
    pull_request:
        branches:
        - pre-deploy
  
jobs:
  setup-ssh:
    uses: ./.github/workflows/setup_ssh.yml
    name: Pre-Deploy
    secrets:
      ssh_user: ${{ secrets.SSH_USER }}
      ssh_host: ${{ secrets.SSH_HOST }}
      work_dir: ${{ secrets.WORK_DIR }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

  pre-deploy:
    needs: setup-ssh
    name: Pre-Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Download SSH Config Artifact
        uses: actions/download-artifact@v4
        with:
            name: ssh-config
            
      - name: Restore SSH Config
        run: |
          mkdir -p ~/.ssh
          tar -xzf ssh_config.tar.gz -C ~/.ssh
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Server and Pull Changes
        run: |
          ssh ${{ secrets.ssh_user }}@${{ secrets.ssh_host }} "
            cd '${{ secrets.work_dir }}' || exit 1 &&
            git remote set-url origin git@github.com:${{ github.repository }}.git &&
            git checkout pre-deploy &&
            git pull origin pre-deploy
          "
      
      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Pull Changes and Start Staging Server
        run: |
          cd ./backend/deploy_config
          chmod +x start_staging_server.sh
          ./start_staging_server.sh ${{ secrets.SSH_USER }} ${{ secrets.SSH_HOST }} ${{ secrets.WORK_DIR }} ${{ github.repository }}
        
      - name: Wait for Server Startup
        run: |
              for i in {1..5}; do
                response_code=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGE_BASE_URL }}/health_check)
                if [ "$response_code" -eq 200 ]; then
                  echo "Server is up!"
                  break
                fi
                echo "Waiting for server..."
                sleep 5
              done
              if [ "$response_code" -ne 200 ]; then
                echo "Server did not start in time."
                exit 1
              fi
        
      - name: Health Check
        run: |
              response_code=$(curl -s -w "%{http_code}" -o /tmp/health_response.json ${{ secrets.STAGE_BASE_URL }}/health_check)
              if [ "$response_code" -ne 200 ]; then
                  echo "Health check failed with status $response_code"
                  exit 1
              else
                  echo "Health check passed!"
                  echo "Server Health Status:"
                  cat /tmp/health_response.json | jq .
              fi
        
      - name: Cleanup
        run: rm -rf ~/.ssh
        