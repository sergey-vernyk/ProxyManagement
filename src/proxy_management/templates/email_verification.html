<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        h3 {
            color: #333;
        }

        h1 {
            color: #007BFF;
        }

        a {
            font-size: 15px;
            color: #007BFF;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h3>Hello, {{email}}.</h3>

    <p>Your verification code is:</p>
    <h1>{{otp_code}}</h1>

    <p>
        Please enter this code by following to <a href="{{verification_url}}">{{verification_url}}</a> to complete
        your verification process. The code is valid for {{otp_expire_time}} minutes.
    </p>

    <p>If you did not request this code, please ignore this email.</p>
</body>

</html>
