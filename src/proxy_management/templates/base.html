<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="196x196" href="/static/img/favicon.png">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onloadTurnstileCallback" async defer></script>
    {% block styles %}
    {% endblock %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/logout.js" type="module"></script>
</head>

<body>
    <div class="navbar">
        <div class="right">
            {% if user %}
                <span class="user-email">{{user.email}}</span>
                <a id="logout-link" href="{{logout_url}}">
                    <span class="material-symbols-outlined">logout</span>
                    Logout
                </a>
            {% else %}
                <a id="login-link" href="{{login_url}}">
                    <span class="material-symbols-outlined">login</span>
                    Login
                </a>
            {% endif %}
        </div>
        <div class="left">
            <a href="/">
                <span class="material-symbols-outlined">home</span>
                Home
            </a>
        </div>
    </div>

    <div class="container-wrapper">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </div>
    {% block scripts %}
    {% endblock %}
</body>

</html>
